<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#ffffff;color:#101828;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#101828;text-underline-offset:3px}
a:hover{color:#101828;text-decoration-thickness:2px}
:focus-visible{outline:2px solid #101828;outline-offset:2px}
</style>
</helmet>
<sc-if value="{{ isClosed }}" hint-placeholder-val="{{ false }}">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f9fafb">
    <button type="button" onClick="{{ reopen }}" style="height:44px;padding:0 20px;background:#101828;border:0;border-radius:8px;cursor:pointer;color:#ffffff;font:500 15px/20px Inter,system-ui,sans-serif" style-hover="background:#344054">Open detail panel</button>
  </div>
</sc-if>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
<div onClick="{{ close }}" aria-hidden="true" style="position:fixed;inset:0;background:rgba(16,24,40,0.4);z-index:40"></div>
<aside ref="{{ panelRef }}" role="dialog" aria-modal="true" aria-labelledby="bec-panel-title" style="position:fixed;top:0;bottom:0;inset-inline-end:0;width:{{ panelWidth }};max-width:100vw;background:#ffffff;box-shadow:0 20px 24px -4px rgba(16,24,40,0.08),0 8px 8px -4px rgba(16,24,40,0.03);border-start-start-radius:{{ radius }};border-end-start-radius:{{ radius }};overflow-y:auto;overflow-x:hidden;z-index:41">
  <div style="position:sticky;top:0;z-index:1;height:64px;display:flex;align-items:center;justify-content:{{ barJustify }};padding:0 {{ barPad }};background:#ffffff;border-bottom:1px solid #eaecf0">
    <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}">
      <button ref="{{ closeRef }}" type="button" onClick="{{ close }}" aria-label="Close details" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#ffffff;border:1px solid #7d879b;border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,0.05);cursor:pointer;color:#344054" style-hover="background:#f9fafb">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button ref="{{ closeRef }}" type="button" onClick="{{ close }}" aria-label="Back" style="width:44px;height:44px;margin-inline-start:-10px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;cursor:pointer;color:#101828" style-hover="background:#f9fafb">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      </button>
    </sc-if>
  </div>

  <div style="padding:{{ bodyPad }};display:flex;flex-direction:column;max-width:816px">
    <span style="font:600 12px/16px Inter,system-ui,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#475467">{{ opp.typeLabel }}</span>
    <h2 id="bec-panel-title" style="margin:8px 0 0;font:600 {{ h2Font }} Barlow,'IBM Plex Sans Arabic',system-ui,sans-serif;color:#101828;text-wrap:pretty">{{ opp.title }}</h2>
    <p style="margin:4px 0 0;font:400 16px/24px Inter,system-ui,sans-serif;color:#475467">{{ opp.company }}</p>
    <div ref="{{ topRef }}" style="margin-top:20px;display:flex">
      <a href="{{ opp.link }}" target="_blank" rel="noopener noreferrer" aria-label="{{ opp.applyLabel }}" style="height:44px;display:inline-flex;align-items:center;padding:0 20px;border-radius:8px;background:#101828;box-shadow:0 1px 2px rgba(16,24,40,0.05);color:#ffffff;text-decoration:none;font:500 15px/20px Inter,system-ui,sans-serif;white-space:nowrap" style-hover="background:#344054;color:#ffffff">Apply on employer site</a>
    </div>

    <dl style="margin:32px 0 0;border-top:2px solid #101828">
      <div style="display:grid;grid-template-columns:{{ factCols }};gap:4px 24px;padding:12px 0;border-bottom:1px solid #eaecf0">
        <dt style="font:600 12px/24px Inter,system-ui,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#475467">Deadline</dt>
        <dd style="margin:0;font:500 15px/24px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:{{ dlColor }}">{{ dlText }}</dd>
      </div>
      <div style="display:grid;grid-template-columns:{{ factCols }};gap:4px 24px;padding:12px 0;border-bottom:1px solid #eaecf0">
        <dt style="font:600 12px/24px Inter,system-ui,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#475467">Location</dt>
        <dd style="margin:0;font:400 15px/24px Inter,system-ui,sans-serif;color:#101828">{{ opp.location }}</dd>
      </div>
      <div style="display:grid;grid-template-columns:{{ factCols }};gap:4px 24px;padding:12px 0;border-bottom:1px solid #eaecf0">
        <dt style="font:600 12px/24px Inter,system-ui,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#475467">Industry</dt>
        <dd style="margin:0;font:400 15px/24px Inter,system-ui,sans-serif;color:#101828">{{ opp.sector }}</dd>
      </div>
      <div style="display:grid;grid-template-columns:{{ factCols }};gap:4px 24px;padding:12px 0;border-bottom:1px solid #eaecf0">
        <dt style="font:600 12px/24px Inter,system-ui,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#475467">Majors</dt>
        <dd style="margin:0;font:400 15px/24px Inter,system-ui,sans-serif;color:#101828;text-wrap:pretty">{{ opp.majorsText }}</dd>
      </div>
    </dl>

    <section aria-labelledby="bec-panel-req" style="margin-top:40px">
      <div style="padding-bottom:12px;border-bottom:2px solid #101828">
        <h3 id="bec-panel-req" style="margin:0;font:600 15px/20px Inter,system-ui,sans-serif;letter-spacing:0.05em;text-transform:uppercase;color:#475467">Requirements</h3>
      </div>
      <ul style="list-style:none;margin:0;padding:0">
        <sc-for list="{{ opp.requirements }}" as="req" hint-placeholder-count="4">
          <li style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #eaecf0;font:400 16px/26px Inter,system-ui,sans-serif;color:#101828">
            <span aria-hidden="true" style="flex:none;width:6px;height:6px;margin-top:10px;border-radius:999px;background:#667085"></span>
            <span>{{ req }}</span>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="bec-panel-about" style="margin-top:40px">
      <div style="padding-bottom:12px;border-bottom:2px solid #101828">
        <h3 id="bec-panel-about" style="margin:0;font:600 15px/20px Inter,system-ui,sans-serif;letter-spacing:0.05em;text-transform:uppercase;color:#475467">About the role</h3>
      </div>
      <div style="margin-top:16px;display:flex;flex-direction:column;gap:16px">
        <sc-for list="{{ opp.paragraphs }}" as="para" hint-placeholder-count="2">
          <p style="margin:0;font:400 16px/26px Inter,system-ui,sans-serif;color:#101828;text-wrap:pretty">{{ para }}</p>
        </sc-for>
      </div>
    </section>
  </div>
</aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;opp&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FormattedOpportunity&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const PANEL_SAMPLE = {
  id: 1, title: 'Graduate Analyst Programme', company: 'Gulf Pearl Bank',
  typeLabel: 'Graduate programme', location: 'Manama', sector: 'Banking & finance',
  majorsText: 'Accounting & finance, Business administration, Economics',
  link: 'https://gulfpearlbank.example/careers/graduate-analyst-programme',
  applyLabel: 'Apply for Graduate Analyst Programme at Gulf Pearl Bank (opens employer site)',
  requirements: ["Bachelor's degree completed in 2025 or 2026", 'Minimum GPA of 3.0', 'Strong analytical and Excel skills', 'Fluent English; Arabic is a plus'],
  paragraphs: ["Gulf Pearl Bank's Graduate Analyst Programme is an 18-month rotational programme for recent graduates who want to build a career in banking."],
  iso: '2026-10-11', deadline: { hasRel: true, relWord: 'TODAY', hasDate: true, noDate: false }
};
const ACCENT = '#a93d35';
const bpOf = () => { const w = window.innerWidth; return w < 600 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop'; };
function deadlineOf(o) {
  const d = o.deadline || {};
  const iso = o.iso || (o.sortDate && o.sortDate !== '9999-12-31' ? o.sortDate : null);
  if (!d.hasDate || !iso) return { text: 'Rolling applications', color: '#475467' };
  if (d.relWord === 'TODAY') return { text: 'Today', color: ACCENT };
  if (d.relWord === 'TOMORROW') return { text: 'Tomorrow', color: ACCENT };
  return { text: iso.split('-').reverse().join('/'), color: '#344054' };
}
class Component extends DCLogic {
  state = { topVisible: true, bp: bpOf(), closed: false };
  panelRef = React.createRef();
  closeRef = React.createRef();
  topRef = React.createRef();
  componentDidMount() {
    if (this.closeRef.current) this.closeRef.current.focus();
    this.onKey = (e) => {
      if (this.state.closed) return;
      if (e.key === 'Escape') { e.preventDefault(); this.doClose(); }
      else if (e.key === 'Tab') this.trap(e);
    };
    this.onResize = () => { const bp = bpOf(); if (bp !== this.state.bp) this.setState({ bp }); };
    document.addEventListener('keydown', this.onKey);
    window.addEventListener('resize', this.onResize);
    if (this.panelRef.current && this.topRef.current && window.IntersectionObserver) {
      this.io = new IntersectionObserver(([en]) => this.setState({ topVisible: en.isIntersecting }),
        { root: this.panelRef.current, rootMargin: '-64px 0px 0px 0px', threshold: 0 });
      this.io.observe(this.topRef.current);
    }
  }
  componentDidUpdate(pp, ps) {
    if (pp.opp && this.props.opp && pp.opp.id !== this.props.opp.id && this.panelRef.current) this.panelRef.current.scrollTop = 0;
    if ((ps.bp === 'mobile') !== (this.state.bp === 'mobile') && this.panelRef.current && !this.panelRef.current.contains(document.activeElement) && this.closeRef.current) this.closeRef.current.focus();
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKey);
    window.removeEventListener('resize', this.onResize);
    if (this.io) this.io.disconnect();
  }
  trap(e) {
    const root = this.panelRef.current;
    if (!root) return;
    const els = [...root.querySelectorAll('a[href],button:not([disabled]),input,select,[tabindex]:not([tabindex="-1"])')]
      .filter(el => el.offsetParent !== null && getComputedStyle(el).visibility !== 'hidden');
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1], active = document.activeElement;
    if (!root.contains(active)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
  }
  doClose() { if (this.props.onClose) this.props.onClose(); else this.setState({ closed: true }); }
  renderVals() {
    const bp = this.state.bp, m = bp === 'mobile';
    const opp = this.props.opp ?? PANEL_SAMPLE;
    const dl = deadlineOf(opp);
    return {
      opp, dlText: dl.text, dlColor: dl.color,
      panelRef: this.panelRef, closeRef: this.closeRef, topRef: this.topRef,
      isMobile: m, notMobile: !m,
      panelWidth: bp === 'desktop' ? '720px' : bp === 'tablet' ? 'min(720px, calc(100vw - 96px))' : '100vw',
      radius: m ? '0' : '12px',
      barJustify: m ? 'flex-start' : 'flex-end', barPad: m ? '16px' : '24px',
      bodyPad: m ? '24px 16px 32px' : '32px 40px 40px',
      h2Font: m ? '22px/30px' : '26px/34px',
      factCols: m ? 'minmax(0,1fr)' : '120px minmax(0,1fr)',
      isClosed: this.state.closed, isOpen: !this.state.closed,
      reopen: () => this.setState({ closed: false }, () => { this.closeRef.current && this.closeRef.current.focus(); }),
      close: () => this.doClose()
    };
  }
}
</script>
</body>
</html>
