<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Poppins:wght@600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#ffffff;color:#2b2523;font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#a93d35;text-underline-offset:3px}
a:hover{color:#8e322c}
:focus-visible{outline:2px solid #a93d35;outline-offset:2px}
</style>
</helmet>
<header style="height:{{ barH }};background:#ffffff;border-bottom:1px solid #e7dfd9">
  <div style="max-width:1264px;height:100%;margin:0 auto;padding:0 {{ gutter }};display:flex;align-items:center;justify-content:space-between;gap:32px">
    <a href="Calendar.dc.html" aria-label="Bahrain Early Careers — home" style="display:flex;border-radius:999px">
      <img src="assets/bec-logo.svg" alt="Bahrain Early Careers — home" width="{{ logo }}" height="{{ logo }}" style="display:block;width:{{ logoPx }};height:{{ logoPx }}">
    </a>
    <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main">
        <ul style="list-style:none;margin:0;padding:0;display:flex;gap:32px">
          <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
            <li style="display:flex">
              <sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}">
                <a href="{{ l.href }}" aria-current="page" style="min-height:44px;display:flex;align-items:center;color:#2b2523;text-decoration:none;font:500 15px/24px 'IBM Plex Sans',system-ui,sans-serif">
                  <span style="padding:4px 0;border-bottom:2px solid #a93d35">{{ l.label }}</span>
                </a>
              </sc-if>
              <sc-if value="{{ l.inactive }}" hint-placeholder-val="{{ true }}">
                <a href="{{ l.href }}" style="min-height:44px;display:flex;align-items:center;color:#5e5653;text-decoration:none;font:500 15px/24px 'IBM Plex Sans',system-ui,sans-serif" style-hover="color:#2b2523">
                  <span style="padding:4px 0;border-bottom:2px solid transparent">{{ l.label }}</span>
                </a>
              </sc-if>
            </li>
          </sc-for>
        </ul>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button ref="{{ menuBtnRef }}" type="button" onClick="{{ openMenu }}" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;margin-inline-end:-8px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;cursor:pointer;color:#2b2523" style-hover="background:#faf7f4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
      </button>
    </sc-if>
  </div>
</header>
<sc-if value="{{ showSheet }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ sheetRef }}" role="dialog" aria-modal="true" aria-label="Menu" style="position:fixed;inset:0;z-index:60;background:#ffffff;display:flex;flex-direction:column;overflow-y:auto">
    <div style="flex:none;height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7dfd9">
      <a href="Calendar.dc.html" aria-label="Bahrain Early Careers — home" style="display:flex;border-radius:999px">
        <img src="assets/bec-logo.svg" alt="Bahrain Early Careers — home" width="48" height="48" style="display:block;width:48px;height:48px">
      </a>
      <button ref="{{ closeRef }}" type="button" onClick="{{ closeMenu }}" aria-label="Close menu" style="width:44px;height:44px;margin-inline-end:-8px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;cursor:pointer;color:#2b2523;font:400 20px/1 'IBM Plex Sans',system-ui,sans-serif" style-hover="background:#faf7f4">✕</button>
    </div>
    <nav aria-label="Main" style="padding:16px">
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <li style="display:flex">
            <sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}">
              <a href="{{ l.href }}" aria-current="page" onClick="{{ closeMenu }}" style="flex:1;min-height:48px;display:flex;align-items:center;color:#2b2523;text-decoration:none;font:500 18px/28px 'IBM Plex Sans',system-ui,sans-serif">
                <span style="padding:4px 0;border-bottom:2px solid #a93d35">{{ l.label }}</span>
              </a>
            </sc-if>
            <sc-if value="{{ l.inactive }}" hint-placeholder-val="{{ true }}">
              <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="flex:1;min-height:48px;display:flex;align-items:center;color:#5e5653;text-decoration:none;font:500 18px/28px 'IBM Plex Sans',system-ui,sans-serif" style-hover="color:#2b2523">
                <span style="padding:4px 0;border-bottom:2px solid transparent">{{ l.label }}</span>
              </a>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </nav>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;calendar&quot;,&quot;opportunities&quot;,&quot;about&quot;],&quot;default&quot;:&quot;opportunities&quot;,&quot;tsType&quot;:&quot;'calendar'|'opportunities'|'about'&quot;}}">
const bpOf = () => { const w = window.innerWidth; return w < 600 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop'; };
const FOCUSABLE = 'a[href],button:not([disabled]),input,select,[tabindex]:not([tabindex="-1"])';
class Component extends DCLogic {
  state = { bp: bpOf(), menuOpen: false };
  menuBtnRef = React.createRef();
  closeRef = React.createRef();
  sheetRef = React.createRef();
  componentDidMount() {
    this.onResize = () => { const bp = bpOf(); if (bp !== this.state.bp) this.setState({ bp }); };
    this.onKey = (e) => {
      if (!this.state.menuOpen || this.state.bp !== 'mobile') return;
      if (e.key === 'Escape') { e.preventDefault(); this.close(); }
      else if (e.key === 'Tab') {
        const root = this.sheetRef.current; if (!root) return;
        const els = [...root.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
        if (!els.length) return;
        const first = els[0], last = els[els.length - 1], a = document.activeElement;
        if (!root.contains(a)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('resize', this.onResize);
    document.addEventListener('keydown', this.onKey);
    if (new URLSearchParams(location.search).get('state') === 'menu') this.setState({ menuOpen: true });
  }
  componentDidUpdate(pp, ps) {
    const open = this.state.menuOpen && this.state.bp === 'mobile';
    const was = ps.menuOpen && ps.bp === 'mobile';
    if (open !== was) {
      document.body.style.overflow = open ? 'hidden' : '';
      if (open && this.closeRef.current) this.closeRef.current.focus();
    }
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('keydown', this.onKey);
  }
  close() { this.setState({ menuOpen: false }, () => { const b = this.menuBtnRef.current; b && b.focus(); }); }
  renderVals() {
    const cur = this.props.current ?? 'opportunities';
    const links = [
      ['calendar', 'Calendar', 'Calendar.dc.html'],
      ['opportunities', 'Opportunities', 'Opportunities.dc.html'],
      ['about', 'About', 'About.dc.html']
    ].map(([key, label, href]) => ({ key, label, href, active: key === cur, inactive: key !== cur }));
    const bp = this.state.bp, m = bp === 'mobile';
    return {
      links, isMobile: m, notMobile: !m,
      barH: m ? '64px' : '80px', logo: m ? 48 : 64, logoPx: m ? '48px' : '64px',
      gutter: bp === 'desktop' ? '32px' : bp === 'tablet' ? '24px' : '16px',
      menuOpen: this.state.menuOpen, showSheet: m && this.state.menuOpen,
      menuBtnRef: this.menuBtnRef, closeRef: this.closeRef, sheetRef: this.sheetRef,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.close()
    };
  }
}
</script>
</body>
</html>
